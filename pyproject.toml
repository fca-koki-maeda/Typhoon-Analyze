[project]
name = "typhoon-analyze"
version = "0.1.0"
description = "台風接近時の九州・沖縄 8 地点の気象変化を可視化する Streamlit アプリ"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.50",
    "pandas>=2.2",
    "plotly>=6.0",
    "pyarrow>=15",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",   # scripts/dev_sample_data.py（暫定）が xlsx を読むためだけに使う
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
